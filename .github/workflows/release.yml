name: Android Release Build

on:
  workflow_dispatch:

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: always

      - name: Build APK (Optimized)
        run: |
          chmod +x ./gradlew

          ./gradlew assembleRelease \
            --no-daemon \
            --non-interactive \
            --stacktrace \
            --console=plain
        env:
          NO_COLOR: "1"
          ORG_GRADLE_PROJECT_android_native_build_output_ignore_errors: true

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
        with:
          releaseDirectory: androidApp/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Sanitize Compose Compiler Report filenames
        shell: bash
        run: |
          for dir in androidApp/build/compose_compiler shared/build/compose_compiler; do
            if [ -d "$dir" ]; then
              find "$dir" -depth -type f -name '*:*' -print0 |
              while IFS= read -r -d '' file; do
                new_file="${file//:/_}"
                mv "$file" "$new_file"
              done
            fi
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pos-offline-release-signed-apk
          path: |
            ${{ steps.sign_app.outputs.signedReleaseFile }}
            androidApp/build/reports/
            androidApp/build/stability/
            androidApp/build/compose_compiler/
            shared/build/reports/
            shared/build/compose_compiler/
            iosApp/build/
          retention-days: 1
          if-no-files-found: error
