name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Android & host tests
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleDebug :shared:testAndroidHostTest --no-daemon --stacktrace --console=plain

  deteksios:
    name: Deteksi pemicu iOS
    runs-on: ubuntu-latest
    outputs:
      jalankan: ${{ steps.gate.outputs.jalankan }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluasi pemicu
        id: gate
        shell: bash
        env:
          NAMA_EVENT: ${{ github.event_name }}
          PESAN_COMMIT: ${{ join(github.event.commits.*.message, ' ') }}
          SHA_SEBELUM: ${{ github.event.before }}
          SHA_SEKARANG: ${{ github.sha }}
        run: |
          if [ "$NAMA_EVENT" = "workflow_dispatch" ]; then
            echo "jalankan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$PESAN_COMMIT" | grep -q '\[ios\]'; then
            echo "jalankan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$SHA_SEBELUM" ] || [ "$SHA_SEBELUM" = "0000000000000000000000000000000000000000" ]; then
            SHA_SEBELUM=$(git rev-parse "$SHA_SEKARANG^" 2>/dev/null || echo "")
          fi
          berubah=$(git diff --name-only "$SHA_SEBELUM" "$SHA_SEKARANG" 2>/dev/null || true)
          if printf '%s\n' "$berubah" | grep -Eq '^(shared/src/(iosMain|appleMain)/|iosApp/|gradle/|(.*/)?[^/]*\.gradle\.kts$|\.github/workflows/ci\.yml$)'; then
            echo "jalankan=true" >> "$GITHUB_OUTPUT"
          else
            echo "jalankan=false" >> "$GITHUB_OUTPUT"
          fi

  ios:
    name: iOS
    needs: deteksios
    if: needs.deteksios.outputs.jalankan == 'true'
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Jalankan tes simulator iOS
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:iosSimulatorArm64Test --no-daemon --stacktrace --console=plain

      - name: Bangun aplikasi iOS
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build
