name: ios-sim-test

on:
  workflow_dispatch:

jobs:
  ios:
    name: iOS Simulator Test
    needs: deteksi
    if: needs.deteksi.outputs.jalankan_ios == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-cleanup: on-success

      - name: Cache Kotlin/Native (.konan)
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Run iOS Simulator Tests
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:iosSimulatorArm64Test --stacktrace --console=plain

      - name: Ringkasan benchmark (Job Summary)
        if: always()
        shell: bash
        run: |
          hasil="$(grep -rhoE 'BENCHMARK \[.*' shared/build/test-results 2>/dev/null | sed -E 's/\]\]>.*$//' | sort -u || true)"
          {
            echo '### Benchmark - iOS simulator'
            echo '```'
            echo "${hasil:-kosong - tidak ada baris BENCHMARK di laporan}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sanitize Compose Compiler Report filenames
        if: always()
        shell: bash
        run: |
          for dir in androidApp/build/compose_compiler shared/build/compose_compiler; do
            if [[ -d "$dir" ]]; then
              find "$dir" -depth -type f -name '*:*' -print0 |
              while IFS= read -r -d '' file; do
                mv "$file" "${file//:/_}"
              done
            fi
          done

      - name: Upload iOS Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-test-results
          path: |
            shared/build/reports/
            shared/build/test-results/
            shared/build/compose_compiler/
          retention-days: 7
          if-no-files-found: warn