name: CI host-test

on:
  workflow_dispatch:
    inputs:
      run_ios:
        description: 'Jalankan job iOS?'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - always
          - never

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: always

      - name: Build Android & host tests
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:testAndroidHostTest --stacktrace --console=plain

      - name: Sanitize Compose Compiler Report filenames
        shell: bash
        run: |
          for dir in androidApp/build/compose_compiler shared/build/compose_compiler; do
            if [ -d "$dir" ]; then
              find "$dir" -depth -type f -name '*:*' -print0 |
              while IFS= read -r -d '' file; do
                new_file="${file//:/_}"
                mv "$file" "$new_file"
              done
            fi
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: host-test
          path: |
             shared/build/
             androidApp/build/
          retention-days: 1
          if-no-files-found: error
